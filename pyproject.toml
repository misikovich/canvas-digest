[project]
name = "uis-assistant"
version = "0.1.0"
description = "UiS Canvas assistant: sync Canvas into a local store, serve it over MCP, notify via OpenClaw"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "tzdata",
]

[project.scripts]
uis = "uis_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uis_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
